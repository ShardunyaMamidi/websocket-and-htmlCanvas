<!DOCTYPE html>
<html>
<head>
    <title>Collaborative Workspace</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="./styles.css"></link>
</head>
<body>

<div class="main-container">
    <div class="canvas-section">
        <h3>Shared Drawing Board</h3>
        <canvas id="drawingCanvas" width="580" height="530"></canvas>
    </div>

    <div class="sidebar">

        <div id="coord-section" class="panel">
            <h3>Live Coordinates</h3>
            <div id="coord-list" class="scroll-area"></div>
        </div>

        <div id="chat-section" class="panel">
            <h3>Live Chat</h3>
            <div id="chat-messages" class="scroll-area"></div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendChatMessage()"/>
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>

    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
