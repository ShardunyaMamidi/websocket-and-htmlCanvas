<div class="lobby-card">
  <h1>Sketch It Out!</h1>

  <div class="input-group">
    <label for="username">Username</label>
    <input
      type="text"
      [(ngModel)]="username"
      id="username"
      placeholder="Enter your name..."
      [disabled]="isJoining"
    />
  </div>

  <div class="input-group">
    <label for="roomid">Room ID</label>
    <input
      type="text"
      [(ngModel)]="roomId"
      id="roomid"
      placeholder="e.g. PixelParty"
      (keyup.enter)="joinRoom()"
      [disabled]="isJoining"
    />
  </div>

  <label class="checkbox-row">
    <input type="checkbox" [(ngModel)]="createRoom" [disabled]="isJoining" />
    Create new room (fails if room already exists)
  </label>

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <button (click)="joinRoom()" [disabled]="isJoining">
    {{ isJoining ? 'Joining...' : 'Enter Room' }}
  </button>
</div>
